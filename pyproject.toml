[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "imbmetrics"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26"]

[project.optional-dependencies]
dev = ["pytest", "scikit-learn", "mypy", "ruff"]

[tool.pytest.ini_options]
testpaths = ["tests"]